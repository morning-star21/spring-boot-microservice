server:
  port: 8081
  servlet:
    context-path: /auth-service

spring:
  application:
    name: auth-service
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        format_sql: true
#    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  jwt:
    secret: ${JWT_SECRET:bezKoderSecretKey012345678901234567890123456789012}
    access-token-expiration-ms: 900000  # 15 minutes
    refresh-token-expiration-ms: 2592000000  # 30 days

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.rahul.auth.controller

logging:
  level:
#    org.springframework.security: INFO
#    root: INFO
#    org.springframework.web: DEBUG
    com.rahul.auth: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka-server/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 30