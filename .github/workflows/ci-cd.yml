name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/spring-microservices

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Run tests
      run: mvn test
    
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build and push Eureka Server image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: ./eureka-server
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/eureka-server:latest
    
    - name: Build and push API Gateway image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: ./api-gateway
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest
    
    - name: Build and push Auth Service image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: ./auth-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth-service:latest
    
    - name: Build and push User Service image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v4
      with:
        context: ./user-service
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.25.0'
    
    - name: Set Kubernetes context
      uses: azure/k8s-set-context@v3
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    
    - name: Deploy to Kubernetes
      run: |
        # Update kubernetes manifests with the new image tags
        sed -i "s|image:.*eureka-server.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/eureka-server:latest|g" k8s/eureka-server.yaml
        sed -i "s|image:.*api-gateway.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest|g" k8s/api-gateway.yaml
        sed -i "s|image:.*auth-service.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/auth-service:latest|g" k8s/auth-service.yaml
        sed -i "s|image:.*user-service.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest|g" k8s/user-service.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/
        
        # Wait for deployments to be ready
        kubectl rollout status deployment/eureka-server
        kubectl rollout status deployment/api-gateway
        kubectl rollout status deployment/auth-service
        kubectl rollout status deployment/user-service
