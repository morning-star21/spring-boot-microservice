server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /auth-service/api/auth/${segment}
            # - StripPrefix=1
            - name: AuthenticationFilter
              args:
                excludedPaths: /v3/api-docs,/swagger-ui, /api/auth  # Exclude paths from authentication


        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /user-service/api/users/${segment}
            # - StripPrefix=1
            - name: AuthenticationFilter
              args:
                excludedPaths: /v3/api-docs,/swagger-ui, /api/users/status  # Exclude paths from authentication

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka-server/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
#    lease-renewal-interval-in-seconds: 30

#logging:
#  level:
#    org.springframework.cloud.gateway: DEBUG
#    org.springframework.cloud.netflix: INFO

app:
  jwt:
    secret: ${JWT_SECRET:bezKoderSecretKey012345678901234567890123456789012}

management:
  endpoints:
    web:
      exposure:
        include: health,info
