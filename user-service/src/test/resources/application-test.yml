spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
#    show-sql: true
  liquibase:
    enabled: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    secret: testSecretKeyWithAtLeast32CharactersForHS256Algorithm

feign:
  client:
    config:
      default:
        connectTimeout: 1000
        readTimeout: 1000
