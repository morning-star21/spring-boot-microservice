server:
  port: 8082
  servlet:
    context-path: /user-service

spring:
  application:
    name: user-service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Swagger OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.rahul.user.controller

logging:
  level:
    com.rahul.user: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka-server/eureka
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 30

app:
  jwt:
    secret: ${JWT_SECRET:bezKoderSecretKey012345678901234567890123456789012}

